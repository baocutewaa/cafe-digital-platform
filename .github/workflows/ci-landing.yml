name: CI — Landing Page & Landing API

on:
  pull_request:
    paths:
      - "apps/landing-page/**"
      - "services/landing-api/**"
      - ".github/workflows/ci-landing.yml"
  push:
    branches: [main]
    paths:
      - "apps/landing-page/**"
      - "services/landing-api/**"

jobs:
  landing-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/landing-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest tests/unit -v

  landing-page:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/landing-page
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/landing-page/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
